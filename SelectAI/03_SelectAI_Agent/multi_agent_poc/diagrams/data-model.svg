<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">데이터·표준화·메타정보·메모리 관계</title><desc id="desc">상품, 판매, 고객, 국가, 시간의 논리 관계와 표준화 사전, 업무 메타데이터, 영속 요청 메모리를 구분한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#172b4d} .heading{font-size:28px;font-weight:700}.title{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#52627a}.edge{fill:none;stroke:#52627a;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="50" class="heading">Data model · standards · metadata · memory</text><text x="40" y="80" class="body">화살표: 참조 방향. SH는 논리 조인 관계이며 전체 물리 스키마를 생략했다.</text><rect x="40" y="120" width="320" height="105" rx="12" fill="#fff" stroke="#cad5e4"/><text x="58" y="150" class="title">PRODUCTS · 72</text><text x="58" y="178" class="body">PROD_ID / NAME / LIST_PRICE</text><text x="58" y="202" class="body">CATEGORY / SUBCATEGORY</text><rect x="440" y="120" width="320" height="105" rx="12" fill="#fff" stroke="#cad5e4"/><text x="458" y="150" class="title">SALES · 918,843</text><text x="458" y="178" class="body">PROD_ID / CUST_ID / TIME_ID</text><text x="458" y="202" class="body">AMOUNT_SOLD / QUANTITY_SOLD</text><rect x="840" y="120" width="320" height="105" rx="12" fill="#fff" stroke="#cad5e4"/><text x="858" y="150" class="title">CUSTOMERS · 55,500</text><text x="858" y="178" class="body">CUST_ID / CUST_GENDER</text><text x="858" y="202" class="body">COUNTRY_ID</text><path class="edge" d="M440 170 H360"/><path class="edge" d="M760 170 H840"/><rect x="440" y="270" width="320" height="90" rx="12" fill="#fff" stroke="#cad5e4"/><text x="458" y="300" class="title">TIMES · 1,826</text><text x="458" y="328" class="body">TIME_ID / CALENDAR_YEAR</text><rect x="840" y="270" width="320" height="90" rx="12" fill="#fff" stroke="#cad5e4"/><text x="858" y="300" class="title">COUNTRIES · 35</text><text x="858" y="328" class="body">COUNTRY_ID / COUNTRY_NAME</text><path class="edge" d="M600 225 V270"/><path class="edge" d="M1000 225 V270"/><rect x="40" y="415" width="535" height="140" rx="12" fill="#e8f2ff" stroke="#cad5e4"/><text x="58" y="445" class="title">표준화 사전 · 실제 값과 표현</text><text x="58" y="473" class="body">DOMAIN → VALUE ← ALIAS (복합 키 연결)</text><text x="58" y="497" class="body">product / country / gender / category / currency</text><text x="58" y="521" class="body">QUESTION_TERM: 매상 → revenue 등 업무 표현</text><text x="58" y="545" class="body">POC_STANDARD + POC_PRODUCT_RESOLVE</text><rect x="625" y="415" width="535" height="140" rx="12" fill="#e9f7f2" stroke="#cad5e4"/><text x="643" y="445" class="title">업무 메타정보 · 생성/검증 계약</text><text x="643" y="473" class="body">DATASET ↔ DATASET_FIELD ↔ FIELD</text><text x="643" y="497" class="body">JOIN / OPERATOR / AGGREGATE / POLICY</text><text x="643" y="521" class="body">PROMPT / SETTING + 필드 한글 표시명</text><text x="643" y="545" class="body">products: 상품 한 행 / sales: 판매 지표</text><rect x="40" y="610" width="535" height="150" rx="12" fill="#fff" stroke="#cad5e4"/><text x="58" y="640" class="title">POC_V2_RUNS · 영속 업무 메모리</text><text x="58" y="668" class="body">request_id PK / 대화 ID + turn ID 유일 키</text><text x="58" y="692" class="body">원문·revision·표준화 문맥·요구 JSON</text><text x="58" y="716" class="body">SQL / 승인 SQL / 실행 SQL / 검토 버전</text><text x="58" y="740" class="body">원시 결과 / 보고서 / 이벤트 / 실행 토큰</text><rect x="625" y="610" width="535" height="150" rx="12" fill="#fff" stroke="#cad5e4"/><text x="643" y="640" class="title">POC_V2_EXECS · Native 실행 추적</text><text x="643" y="668" class="body">execution_id PK / request_id FK</text><text x="643" y="692" class="body">요청당 round_no 유일 키 / revision</text><text x="643" y="716" class="body">Native 대화 ID / 단계 전후 / Native 상태</text><text x="643" y="740" class="body">Task 이력 스냅샷 / raw 출력 / 오류</text><path class="edge" d="M308 555 V610"/><path class="edge" d="M893 555 V583 H575 V650"/><path class="edge" d="M625 710 H575"/><rect x="40" y="810" width="1120" height="90" rx="12" fill="#fff4df" stroke="#cad5e4"/><text x="58" y="840" class="title">모델 대화 이력은 별도 계층</text><text x="58" y="868" class="body">Native 문맥 / Team 이력 길이 1 / Tool별 독립 대화 ≠ DB 승인·실행 근거. 벡터 메모리·자동 대화 분석은 범위 밖.</text><text x="40" y="925" class="small">건수: 2026-11-20 LAB 검증 시점. 원천·표준화·메타데이터는 이 프로젝트 설치에서 변경하지 않는다.</text></svg>
