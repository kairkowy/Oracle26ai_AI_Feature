<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="945" viewBox="0 0 1120 945" role="img" aria-labelledby="title desc"><title id="title">POC 전체 구조</title><desc id="desc">Supervisor와 세 Worker, 실제 Tool과 DB 프로그램, 기존 데이터 및 메모리 관계</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><style>text{font-family:"Malgun Gothic",sans-serif;fill:#1e293b}.h{font-size:27px;font-weight:700}.t{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f6f8fc"/><text x="40" y="48" class="h">AI Agent와 DB 프로그램의 역할</text><text x="40" y="80" class="b">Supervisor 1개 · 표준화 / 조회 / 검토 Worker 3개</text><rect x="40" y="115" width="1040" height="90" rx="12" fill="#e8f1ff" stroke="#cbd5e1"/><text x="60" y="146" class="t">사용자 질문 / 실제 후보 선택</text><text x="60" y="175" class="b">공개 진입점이 원문과 요청 상태를 먼저 저장한다.</text><path d="M560 205 V245" class="edge"/><rect x="40" y="245" width="1040" height="90" rx="12" fill="#ececff" stroke="#cbd5e1"/><text x="60" y="276" class="t">Native Supervisor</text><text x="60" y="305" class="b">지정된 Worker에 요청 ID로 작업을 위임한다.</text><path d="M560 335 V365 H200 V400" class="edge"/><path d="M560 365 V400" class="edge"/><path d="M560 365 H920 V400" class="edge"/><rect x="40" y="400" width="320" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="431" class="t">표준화 Worker</text><text x="60" y="460" class="b">표현을 실제 값에 연결</text><text x="60" y="485" class="b">실제 상품 후보 확인</text><rect x="400" y="400" width="320" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="420" y="431" class="t">조회 Worker</text><text x="420" y="460" class="b">요구 해석과 SQL 생성</text><text x="420" y="485" class="b">승인 SQL 실행 · 답변 작성</text><rect x="760" y="400" width="320" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="780" y="431" class="t">검토 Worker</text><text x="780" y="460" class="b">실행 전 질문과 SQL 대조</text><text x="780" y="485" class="b">실행 후 결과 구조 확인</text><path d="M200 520 V565" class="edge"/><path d="M560 520 V565" class="edge"/><path d="M920 520 V565" class="edge"/><rect x="40" y="565" width="1040" height="120" rx="12" fill="#e8f6ef" stroke="#cbd5e1"/><text x="60" y="596" class="t">DB 프로그램과 등록 Tool</text><text x="60" y="625" class="b">허용된 상태·요청 버전·승인 SQL을 검사하고 각 업무 단계를 수행한다.</text><text x="60" y="650" class="b">다음 작업 제어와 최종 반환 검증은 DB에 저장된 근거를 사용한다.</text><path d="M200 685 V735" class="edge"/><path d="M560 685 V735" class="edge"/><path d="M920 685 V735" class="edge"/><rect x="40" y="735" width="320" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="766" class="t">기존 데이터</text><text x="60" y="795" class="b">상품 · 판매 · 고객 · 국가 · 날짜</text><text x="60" y="820" class="b">읽기 재사용</text><rect x="400" y="735" width="320" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="420" y="766" class="t">표준화 / 메타정보</text><text x="420" y="795" class="b">표현 ↔ 실제 값</text><text x="420" y="820" class="b">지표 · 조인 · 집계 · 허용 필드</text><rect x="760" y="735" width="320" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="780" y="766" class="t">업무 상태 / 실행 추적</text><text x="780" y="795" class="b">원문 · SQL · 승인 · 결과</text><text x="780" y="820" class="b">Native 호출 이력</text><text x="40" y="910" class="s">Human 대기 상태의 상위 Team 전파 문제는 미해결이며 저장된 사용자 확인 상태를 기준으로 차단한다.</text></svg>
