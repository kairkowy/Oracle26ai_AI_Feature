<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">AI Multi-Agent POC 구조</title><desc id="desc">공개 Gate가 Native Supervisor와 세 Worker를 단계별 호출한다. Worker Tool은 표준화, 메타데이터, SH를 사용하고 DB에 요청 및 실행을 저장한다. 최종 Gate는 저장 결과를 검증한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#172b4d} .heading{font-size:28px;font-weight:700}.title{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#52627a}.edge{fill:none;stroke:#52627a;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="50" class="heading">AI Multi-Agent · Native orchestration + verified DB state</text><text x="40" y="80" class="body">Supervisor 1 · Workers 3 · 기존 판매 데이터 / 표준화 / 메타정보 재사용</text><rect x="40" y="110" width="300" height="105" rx="12" fill="#fff" stroke="#cad5e4"/><text x="58" y="140" class="title">사용자 / 클라이언트</text><text x="58" y="168" class="body">질문 · 대화 ID · turn ID</text><text x="58" y="192" class="body">후보 선택은 실제 사용자 답변</text><rect x="390" y="110" width="770" height="105" rx="12" fill="#e8f2ff" stroke="#cad5e4"/><text x="408" y="140" class="title">POC_V2_GATE.run / resume</text><text x="408" y="168" class="body">요청 초기화 · 상태/버전 검사 · Native 재진입 제어</text><text x="408" y="192" class="body">최종 반환: 저장 보고서 + 검증된 원시 행만 공개</text><path class="edge" d="M340 160 H390"/><rect x="390" y="260" width="770" height="105" rx="12" fill="#edf0ff" stroke="#cad5e4"/><text x="408" y="290" class="title">Native Supervisor · granite4.1:8b</text><text x="408" y="318" class="body">저장 제어 정보 → ORA$DELEGATE_TOOL → 지정 Worker / Task</text><text x="408" y="342" class="body">task_input = 32자리 request_id 문자열</text><path class="edge" d="M775 215 V260"/><rect x="40" y="420" width="350" height="130" rx="12" fill="#fff" stroke="#cad5e4"/><text x="58" y="450" class="title">Standard Worker</text><text x="58" y="478" class="body">일반 Task: 표준화 Tool 호출</text><text x="58" y="502" class="body">Human Task: 실제 상품 후보 확인</text><text x="58" y="526" class="body">POC_V2_STANDARD_FN</text><rect x="425" y="420" width="350" height="130" rx="12" fill="#fff" stroke="#cad5e4"/><text x="443" y="450" class="title">Query Worker</text><text x="443" y="478" class="body">일반 Task: 생성 / 실행 / 보고</text><text x="443" y="502" class="body">Human Task: 실제 조회 의도 확인</text><text x="443" y="526" class="body">POC_V2_QUERY_FN</text><rect x="810" y="420" width="350" height="130" rx="12" fill="#fff" stroke="#cad5e4"/><text x="828" y="450" class="title">Review Worker</text><text x="828" y="478" class="body">일반 Task: 실행 전 / 후 검토</text><text x="828" y="502" class="body">승인 버전 · SQL · 결과 검증</text><text x="828" y="526" class="body">POC_V2_REVIEW_FN</text><path class="edge" d="M775 365 V393 H215 V420"/><path class="edge" d="M775 393 H600 V420"/><path class="edge" d="M775 393 H985 V420"/><rect x="40" y="600" width="1120" height="105" rx="12" fill="#e9f7f2" stroke="#cad5e4"/><text x="58" y="630" class="title">POC_V2_GATE.dispatch → POC_V2_API</text><text x="58" y="658" class="body">허용 상태·revision 확인 → 표준화 → 요구 해석/SQL 생성 → 사전 검토 → 동일 SQL 실행 → 사후 검토 → 보고</text><text x="58" y="682" class="body">Tool 내부 모델: gemma2:9b · 실행: DBMS_SQL · SQL 동일성: 전체 CLOB 비교</text><path class="edge" d="M215 550 V600"/><path class="edge" d="M600 550 V600"/><path class="edge" d="M985 550 V600"/><rect x="40" y="755" width="350" height="140" rx="12" fill="#fff" stroke="#cad5e4"/><text x="58" y="785" class="title">기존 데이터 / 표준화</text><text x="58" y="813" class="body">SH: PRODUCTS / SALES 외 3개</text><text x="58" y="837" class="body">POC_STD_* / QUESTION_TERM</text><text x="58" y="861" class="body">POC_STANDARD / PRODUCT_RESOLVE</text><text x="58" y="885" class="body">읽기 재사용 · 재적재 없음</text><rect x="425" y="755" width="350" height="140" rx="12" fill="#fff" stroke="#cad5e4"/><text x="443" y="785" class="title">기존 업무 메타정보</text><text x="443" y="813" class="body">데이터셋 · 필드 · 허용 조인</text><text x="443" y="837" class="body">연산자 · 집계 · 정책 · 프롬프트</text><text x="443" y="861" class="body">상품 한 행 / 판매 집계 구분</text><text x="443" y="885" class="body">값 사전과 SQL 계약 구분</text><rect x="810" y="755" width="350" height="140" rx="12" fill="#fff" stroke="#cad5e4"/><text x="828" y="785" class="title">영속 업무 / 추적 메모리</text><text x="828" y="813" class="body">RUNS: 요청·승인·실행·결과</text><text x="828" y="837" class="body">EXECS: Native 호출 / Task 이력</text><text x="828" y="861" class="body">Worker 간 명시적 요청 ID 전달</text><text x="828" y="885" class="body">Native 자유 답변 ≠ 검증 결과</text><path class="edge" d="M215 705 V755"/><path class="edge" d="M600 705 V755"/><path class="edge" d="M985 705 V755"/><rect x="40" y="945" width="1120" height="105" rx="12" fill="#fff4df" stroke="#cad5e4"/><text x="58" y="975" class="title">Human 연동 제약 · 업무 상태가 기준</text><text x="58" y="1003" class="body">Worker WAITING_FOR_HUMAN 관찰 / 상위 Team SUCCEEDED 반환: 미해결</text><text x="58" y="1027" class="body">Gate는 NEEDS_CLARIFICATION에서 차단 → 실제 후보 ID 검증 → revision 증가 → Native 재개</text><text x="40" y="1080" class="small">실선: 호출·접근 관계. 단계마다 Gate가 저장 상태를 읽어 다음 Native 실행을 요청한다.</text></svg>
