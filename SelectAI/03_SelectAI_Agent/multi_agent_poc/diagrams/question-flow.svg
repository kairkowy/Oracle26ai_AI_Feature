<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960" role="img" aria-labelledby="title desc"><title id="title">자연어 질문 처리 흐름</title><desc id="desc">예제 질문의 저장, 표준화, SQL 생성, 검토, 실행, 답변 흐름</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><style>text{font-family:"Malgun Gothic",sans-serif;fill:#1e293b}.h{font-size:27px;font-weight:700}.t{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f6f8fc"/><text x="40" y="48" class="h">질문 하나가 답변이 되기까지</text><text x="40" y="80" class="b">미국 여자 고객이 구매한 야구용품의 매상 합계를 조회해줘.</text><rect x="40" y="115" width="1000" height="95" rx="12" fill="#e8f1ff" stroke="#cbd5e1"/><text x="60" y="146" class="t">1. 질문과 요청 저장</text><text x="60" y="175" class="b">원문을 보관하고 요청 ID를 만든다.</text><path d="M540 210 V245" class="edge"/><rect x="40" y="245" width="1000" height="95" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="276" class="t">2. 표현 표준화</text><text x="60" y="305" class="b">미국 → United States of America · 여자 → F · 야구용품 → Baseball</text><path d="M540 340 V375" class="edge"/><rect x="40" y="375" width="1000" height="95" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="406" class="t">3. 조회 요구와 SQL 생성</text><text x="60" y="435" class="b">매상 = 매출액 · 합계 = SUM · 상품별 그룹화 없음</text><path d="M540 470 V505" class="edge"/><rect x="40" y="505" width="1000" height="95" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="536" class="t">4. 실행 전 검토</text><text x="60" y="565" class="b">질문·조건·집계·SQL을 대조하고 승인할 SQL을 저장한다.</text><path d="M540 600 V635" class="edge"/><rect x="40" y="635" width="1000" height="95" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="666" class="t">5. 승인 SQL 실행과 결과 검토</text><text x="60" y="695" class="b">승인된 SQL 그대로 실행하고 원시 결과를 확인한다.</text><path d="M540 730 V765" class="edge"/><rect x="40" y="765" width="1000" height="95" rx="12" fill="#e8f6ef" stroke="#cbd5e1"/><text x="60" y="796" class="t">6. 확인된 결과로 답변</text><text x="60" y="825" class="b">저장된 수치와 보고서의 버전을 검증해 사용자에게 반환한다.</text><text x="40" y="930" class="s">후보가 모호하면 실제 사용자에게 확인한 뒤 이어 간다.</text></svg>
